# Build the Linux / Steam Deck command-line tool.
#
# Every push gets a downloadable build artifact. A "linux-v*" tag also publishes it as a release;
# the prefix differs from the Windows app's "D2RExtractor_v*" so neither tag triggers the other's
# release workflow.
name: Linux

on:
  push:
    branches: ["**"]
    tags: ["linux-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test D2RExtractor.Cli.Tests -c Release

      - name: Publish
        run: dotnet publish D2RExtractor.Cli -c Release -r linux-x64 -o out

      # A tarball keeps the executable bit, which a plain download would lose.
      - name: Package
        run: |
          tar -czf d2rextract-linux-x64.tar.gz -C out d2rextract
          sha256sum d2rextract-linux-x64.tar.gz > d2rextract-linux-x64.tar.gz.sha256
          cat d2rextract-linux-x64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: d2rextract-linux-x64
          path: |
            d2rextract-linux-x64.tar.gz
            d2rextract-linux-x64.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            d2rextract-linux-x64.tar.gz
            d2rextract-linux-x64.tar.gz.sha256
